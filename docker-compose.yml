# Lernzirkel site tanımı. Contabo VPS'teki paylaşımlı platforma (Traefik, Postgres)
# bağlanır — bkz. DEPLOYMENT.md. Ağlar platform/scripts/bootstrap-networks.sh ile
# oluşturulmuştur (edge, data).
#
# Sunucuda (/opt/sites/lernzirkel, kaynak kod burada):
#   docker compose --env-file .env.production build
#   docker compose --env-file .env.production up -d
# İlk kurulum: DEPLOYMENT.md
#
# --env-file .env.production hem aşağıdaki ${...} değerleri hem de konteyner ortamı içindir.
# SITE_HOST ve NEXT_PUBLIC_SITE_URL bu dosyada tanımlı olmalıdır.

name: lernzirkel

networks:
  edge:
    external: true
  data:
    external: true

volumes:
  uploads: # kullanıcı yüklemeleri (public/uploads); kök dosya sistemi salt okunur olduğundan ayrı volume

# Saldırı yüzeyi azaltma:
#  - read_only: ele geçirilse bile kalıcı ikili/betik bırakılamaz
#  - cap_drop ALL, no-new-privileges: yetki yükseltme yok
#  - pids_limit: fork bomb / kontrolsüz süreç üretimi sınırlanır
#  - mem_limit/cpus: tek konteyner kaynağı tüketemez
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  pids_limit: 512
  restart: unless-stopped

services:
  app:
    <<: *hardening
    build:
      context: .
      target: runner
      # CMS'den beslenen sayfalar (örn. /projekte) build sırasında gerçek veriyle statik
      # üretiliyor (next build SSG) — bu yüzden builder'ın data ağından Postgres'e erişmesi
      # gerekiyor. DATABASE_URL yalnızca builder aşamasının katman geçmişinde kalır (bu imaj
      # hiçbir registry'ye push edilmiyor); runner aşamasına kopyalanmaz, çalışma zamanında
      # ayrıca env_file ile verilir.
      network: data
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL gerekli}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        DATABASE_URL: ${DATABASE_URL:?DATABASE_URL gerekli}
    image: lernzirkel-app:${APP_TAG:-local}
    env_file:
      - .env.production
    networks:
      - edge # Traefik + dış API'ler (Resend, Turnstile...)
      - data # Postgres
    volumes:
      - uploads:/app/public/uploads
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      # ISR/revalidate önbelleği; yeniden başlatmada sıfırlanır (kabul edilen)
      - /app/.next/cache:rw,noexec,nosuid,nodev,uid=1001,gid=1001,size=256m
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      # SITE_HOST = canonical (www), SITE_HOST_ALT = apex; apex -> www 301 yönlendirilir.
      - traefik.http.routers.lernzirkel.rule=Host(`${SITE_HOST:?SITE_HOST gerekli}`) || Host(`${SITE_HOST_ALT:-${SITE_HOST}}`)
      - traefik.http.routers.lernzirkel.middlewares=lernzirkel-apexredirect
      - traefik.http.middlewares.lernzirkel-apexredirect.redirectregex.regex=^https://lernzirkel-ludwigshafen\.de(.*)
      - traefik.http.middlewares.lernzirkel-apexredirect.redirectregex.replacement=https://www.lernzirkel-ludwigshafen.de$${1}
      - traefik.http.middlewares.lernzirkel-apexredirect.redirectregex.permanent=true
      - traefik.http.routers.lernzirkel.entrypoints=websecure
      - traefik.http.routers.lernzirkel.tls.certresolver=cloudflare
      - traefik.http.services.lernzirkel.loadbalancer.server.port=3000

  # Tek seferlik işler; `up` ile başlamaz (profil). Örnek:
  #   docker compose --env-file .env.production --profile tools run --rm tools npx prisma db push
  # edge ağı Prisma'nın şema motorunu indirebilmesi içindir (data ağı internete kapalı).
  tools:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    image: lernzirkel-tools:${APP_TAG:-local}
    env_file:
      - .env.production
    networks:
      - data
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 1g
    cpus: 1
    restart: "no"
